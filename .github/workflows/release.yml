name: release
# Builds the Bridge for Linux, Windows and macOS on GitHub's runners, publishes it as a release
# of this repository with SHA256SUMS and signed build provenance, and updates the Homebrew tap.
#
# Start it either way:
# - push a version tag (v0.3.0, matching the version in Cargo.toml), or
# - Actions > release > Run workflow on main, with the tag: the workflow creates that tag on
#   main's latest commit first, so a release needs no computer.
#
# The tap step needs the repository secret TAP_TOKEN: a fine-grained token with
# Contents: read and write on Hubert-Rybak/homebrew-pocketwire. Without it the release is
# still published and the tap is left as it is.
#
# Every release also carries winget-manifests.zip. Once Pocketwire.Bridge is in
# microsoft/winget-pkgs (the first version is submitted by hand, see packaging/winget/README.md),
# the winget job sends each new version there itself, given the secret WINGET_TOKEN: a classic
# token with the public_repo scope from the account that owns the winget-pkgs fork.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.3.0 (created on this branch's latest commit if it doesn't exist yet)"
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Check the version, and create the tag when started by hand
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' || { echo "bad tag: $TAG"; exit 1; }
          v="${TAG#v}"
          create=no
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            git checkout -q "$TAG"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            create=yes
          else
            echo "tag $TAG not found"; exit 1
          fi
          c=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$v" = "$c" ] || { echo "tag $TAG does not match Cargo.toml version $c"; exit 1; }
          if [ "$create" = yes ]; then
            git config user.name "Hubert Rybak"
            git config user.email "h.rybak@gmail.com"
            git tag -a "$TAG" -m "Pocketwire Bridge $v"
            git push origin "refs/tags/$TAG"
            echo "Created tag $TAG on $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, arch: amd64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: |
          export "CC_$(echo ${{ matrix.target }} | tr - _)=musl-gcc"
          cargo +stable build --release --locked --target ${{ matrix.target }}
          mkdir -p dist && cp target/${{ matrix.target }}/release/pocketwire dist/pocketwire-linux-${{ matrix.arch }}
          ./dist/pocketwire-linux-${{ matrix.arch }} version
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/

  windows:
    needs: version
    strategy:
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, arch: amd64 }
          - { target: aarch64-pc-windows-msvc, arch: arm64 }
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          # ring builds its ARM64 assembly with clang, which comes with the runner's LLVM.
          echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
      - name: Build
        run: |
          mkdir -p dist gui
          cargo +stable build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/pocketwire.exe dist/pocketwire-windows-${{ matrix.arch }}.exe
          cp target/${{ matrix.target }}/release/pocketwire.exe gui/pocketwire.exe
          cargo +stable build --release --locked --target ${{ matrix.target }} --features gui
          cp target/${{ matrix.target }}/release/pocketwire.exe gui/PocketwireBridge.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: installer-input-${{ matrix.arch }}
          path: gui/

  windows-installer:
    needs: [version, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-input-*
          path: in
      - run: |
          for arch in amd64 arm64; do
            packaging/windows/build.sh "${{ needs.version.outputs.version }}" "$arch" "in/installer-input-$arch" dist
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-installers
          path: dist/

  macos:
    needs: version
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Rust
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin && rustup default stable
      - name: Command line builds
        run: |
          mkdir -p dist
          for p in aarch64-apple-darwin:arm64 x86_64-apple-darwin:amd64; do
            t=${p%:*}; a=${p#*:}
            cargo build --release --locked --target "$t"
            cp "target/$t/release/pocketwire" "dist/pocketwire-darwin-$a"
          done
          ./dist/pocketwire-darwin-arm64 version
      - name: Menu bar app
        run: packaging/macos/build-app.sh "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/

  publish:
    needs: [version, linux, windows, windows-installer, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Winget manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          amd64=$(sha256sum dist/pocketwire-setup-windows-amd64.exe | cut -d' ' -f1)
          arm64=$(sha256sum dist/pocketwire-setup-windows-arm64.exe | cut -d' ' -f1)
          src/packaging/winget/render.sh "$VERSION" "$amd64" "$arm64" winget
          (cd winget && zip -qr ../dist/winget-manifests.zip manifests)
          unzip -l dist/winget-manifests.zip
      - name: Checksums
        run: |
          cd dist
          chmod +x pocketwire-linux-* pocketwire-darwin-*
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/pocketwire-*
            dist/Pocketwire-Bridge-macos.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          Pocketwire Bridge $VERSION for macOS, Windows and Linux, built from this tag by the
          [release workflow](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          - macOS: \`brew install --cask hubert-rybak/pocketwire/pocketwire-bridge\`, or Pocketwire-Bridge-macos.zip (menu bar app, Apple silicon and Intel)
          - Windows: \`winget install Pocketwire.Bridge\`, or pocketwire-setup-windows-amd64.exe or -arm64.exe (installer, no administrator rights). winget-manifests.zip holds this version's manifests for winget-pkgs.
          - Linux: pocketwire-linux-amd64 or -arm64 (static), or \`brew install hubert-rybak/pocketwire/pocketwire\` to build from source

          Check a download:

          \`\`\`sh
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify pocketwire-linux-amd64 --repo $GITHUB_REPOSITORY
          \`\`\`
          NOTES
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Pocketwire Bridge $VERSION" --notes-file notes.md

  tap:
    needs: [version, publish]
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
      TAP_REPO: Hubert-Rybak/homebrew-pocketwire
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tap not configured
        if: env.TAP_TOKEN == ''
        run: echo "TAP_TOKEN is not set; the release is published, the Homebrew tap was not updated." >> "$GITHUB_STEP_SUMMARY"
      - name: Update the cask and the formula
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern Pocketwire-Bridge-macos.zip --dir in
          app_sha=$(sha256sum in/Pocketwire-Bridge-macos.zip | cut -d' ' -f1)
          src_sha=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz" | sha256sum | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$TAP_REPO.git" tap
          mkdir -p tap/Casks tap/Formula
          packaging/homebrew/render.sh cask "$VERSION" "$app_sha" > tap/Casks/pocketwire-bridge.rb
          packaging/homebrew/render.sh formula "$VERSION" "$src_sha" > tap/Formula/pocketwire.rb
          cd tap
          git config user.name "Hubert Rybak"
          git config user.email "h.rybak@gmail.com"
          git add Casks/pocketwire-bridge.rb Formula/pocketwire.rb
          git diff --cached --quiet && { echo "tap already up to date"; exit 0; }
          git commit -m "pocketwire-bridge $VERSION"
          git push origin HEAD

  winget:
    needs: [version, publish]
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Winget not configured
        if: env.WINGET_TOKEN == ''
        run: echo "WINGET_TOKEN is not set; the release is published, winget was not updated." >> "$GITHUB_STEP_SUMMARY"
      - id: listed
        name: Check that Pocketwire.Bridge is already in winget-pkgs
        if: env.WINGET_TOKEN != ''
        run: |
          if curl -fsS -o /dev/null -H "Authorization: Bearer $WINGET_TOKEN" \
              https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/p/Pocketwire/Bridge; then
            echo "listed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "listed=no" >> "$GITHUB_OUTPUT"
            echo "Pocketwire.Bridge is not in winget-pkgs yet: submit winget-manifests.zip from this release once with wingetcreate (see packaging/winget/README.md). Later releases are sent automatically." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Send this version to winget-pkgs
        if: steps.listed.outputs.listed == 'yes'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Pocketwire.Bridge
          version: ${{ needs.version.outputs.version }}
          release-tag: ${{ env.TAG }}
          installers-regex: 'pocketwire-setup-windows-(amd64|arm64)\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
